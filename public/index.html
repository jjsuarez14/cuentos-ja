<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070E16">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cuentos J.A.">
<meta name="description" content="Cuentos para la siesta y la noche de J.A.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<title>Cuentos de J.A.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#070E16;
  --glass-1:rgba(255,255,255,.06);
  --glass-2:rgba(255,255,255,.09);
  --glass-3:rgba(255,255,255,.13);
  --hair:rgba(255,255,255,.08);
  --t1:#F5F7FA; --t2:#8B98A5; --t3:#5B6672;
  --read:#D3D9E0;
  --accent:#FFB86B; --accent-soft:rgba(255,184,107,.14);
  --cta-bg:#EDEFF2; --cta-t:#0A1420;
  --ok:#2DD4A7;
  --r-card:22px; --r-sm:16px;
  --read-size:1.2rem;
  --ui:"Manrope","SF Pro Rounded","SF Pro Display",ui-rounded,system-ui,-apple-system,sans-serif;
  --serif:"Literata",Georgia,"Times New Roman",serif;
}
/* Modo nocturno: texto sepia cálido, menos luz azul */
html.nocturno{--bg:#05080C;--read:#C9B99E;--t1:#E6DCCB;--t2:#8A8070;--t3:#5E574C;--accent:#E8A868;--cta-bg:#E6DCCB;--glass-1:rgba(255,236,210,.045);--glass-2:rgba(255,236,210,.07);--glass-3:rgba(255,236,210,.1);--hair:rgba(255,236,210,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--t1);font-family:var(--ui);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  background-image:radial-gradient(120% 60% at 50% -10%,rgba(255,184,107,.10),transparent 60%),radial-gradient(80% 40% at 100% 0%,rgba(120,140,255,.06),transparent 60%);background-attachment:fixed;background-repeat:no-repeat}
html.nocturno body{background-image:radial-gradient(120% 60% at 50% -10%,rgba(232,168,104,.06),transparent 60%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.app{max-width:480px;margin:0 auto;padding-inline:20px;padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
.glass{background:var(--glass-1);border:1px solid var(--hair);border-radius:var(--r-card)}

/* Cabecera */
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 22px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{flex:none}
.brand h1{margin:0;font-size:1.2rem;font-weight:800;letter-spacing:-.01em}
.brand p{margin:1px 0 0;color:var(--t2);font-size:.82rem;font-weight:600}
.round{width:42px;height:42px;border-radius:999px;background:var(--glass-2);border:1px solid var(--hair);display:grid;place-items:center;flex:none}
.round svg{width:20px;height:20px}
.round[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* Héroe: cuento que toca */
.eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin:0 0 10px}
.hero{padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.035));}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,184,107,.22),transparent 65%);pointer-events:none}
.chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding-inline:11px;border-radius:999px;background:var(--glass-2);font-size:.78rem;font-weight:700;color:var(--t2)}
.chip svg{width:14px;height:14px}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.hero h2{margin:0;font-size:1.65rem;line-height:1.15;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.hero .tema{margin:0;color:var(--t2);font-weight:600;font-size:.95rem}
.meta{display:flex;gap:14px;color:var(--t3);font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:999px;background:var(--cta-bg);color:var(--cta-t);font-weight:800;font-size:1rem;width:100%}
.cta svg{width:18px;height:18px}
.cta.done{background:transparent;color:var(--ok);box-shadow:inset 0 0 0 1.5px var(--ok)}
.next{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:14px 16px;margin-top:10px;width:100%;text-align:left}
.next .ic{width:40px;height:40px;border-radius:999px;background:var(--glass-2);display:grid;place-items:center;color:var(--t2)}
.next .ic svg{width:18px;height:18px}
.next b{display:block;font-weight:700;font-size:.98rem;line-height:1.25}
.next small{display:block;color:var(--t3);font-weight:700;font-size:.76rem;margin-top:2px;text-transform:uppercase;letter-spacing:.08em}
.next .arr{color:var(--t3)}
.aviso{margin:12px 2px 0;color:var(--t2);font-size:.84rem}

/* Semana */
.sec{margin-top:34px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 12px}
.sec-h h3{margin:0;font-size:1.05rem;font-weight:800}
.sec-h span{color:var(--t3);font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:repeat(4,1fr);padding:4px;border-radius:999px;background:var(--glass-1);border:1px solid var(--hair);margin-bottom:8px}
.seg button{height:36px;border-radius:999px;font-weight:800;font-size:.86rem;color:var(--t2)}
.seg button[aria-pressed="true"]{background:var(--glass-3);color:var(--t1)}
.seg button:disabled{color:var(--t3);opacity:.55}
.rango{color:var(--t3);font-size:.8rem;font-weight:700;margin:0 4px 14px}
.dias{display:flex;flex-direction:column;gap:10px}
.dia{overflow:hidden;border-radius:var(--r-sm)}
.dia.hoy{box-shadow:inset 0 0 0 1.5px rgba(255,184,107,.55)}
.dia-h{display:flex;justify-content:space-between;padding:12px 16px 2px;font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.dia.hoy .dia-h{color:var(--accent)}
.row{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 16px;min-height:58px}
.row + .row{border-top:1px solid var(--hair)}
.row .m{color:var(--t3);display:grid;place-items:center}
.row .m svg{width:16px;height:16px}
.row b{display:block;font-weight:700;font-size:.97rem;line-height:1.25}
.row small{display:block;color:var(--t3);font-weight:600;font-size:.78rem;margin-top:2px}
.row .r{color:var(--t3);font-size:.78rem;font-weight:800;font-variant-numeric:tabular-nums}
.row .r.ok{color:var(--ok)}
.row.vacia b{color:var(--t3);font-weight:600}
.pie{color:var(--t3);font-size:.78rem;line-height:1.55;margin:28px 4px 0}

/* Lector */
.bar{position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top,0px);background:rgba(7,14,22,.72);-webkit-backdrop-filter:saturate(160%) blur(18px);backdrop-filter:saturate(160%) blur(18px);border-bottom:1px solid var(--hair)}
html.nocturno .bar{background:rgba(5,8,12,.8)}
.bar-in{max-width:480px;margin:0 auto;padding-inline:14px;height:56px;display:flex;align-items:center;gap:8px}
.pill-btn{display:inline-flex;align-items:center;gap:4px;height:38px;padding-inline:12px 14px;border-radius:999px;background:var(--glass-2);font-weight:800;font-size:.9rem}
.pill-btn svg{width:18px;height:18px}
.sp{flex:1}
.prog{height:2px;background:transparent}
.prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:0 2px 2px 0;transition:width .12s linear}
.lector{max-width:480px;margin:0 auto;padding:26px 24px calc(env(safe-area-inset-bottom,0px) + 60px)}
.lector h1{font-size:1.9rem;line-height:1.14;font-weight:800;letter-spacing:-.02em;margin:14px 0 6px;text-wrap:balance}
.fuente{color:var(--t2);font-family:var(--serif);font-style:italic;font-size:.95rem;margin:0 0 28px}
.orn{display:flex;justify-content:center;margin:0 0 26px;color:var(--t3)}
.texto{font-family:var(--serif);font-size:var(--read-size);line-height:1.75;color:var(--read)}
.texto p{margin:0 0 .95em}
.texto p:first-child::first-letter{float:left;font-size:3.3em;line-height:.86;padding:.06em .1em 0 0;color:var(--accent);font-weight:500}
.fin{margin-top:40px;display:flex;flex-direction:column;gap:12px;align-items:stretch}
.fin .orn{margin:0 0 8px}
.ghost{height:52px;border-radius:999px;background:var(--glass-1);border:1px solid var(--hair);font-weight:700;font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:8px;padding-inline:16px;text-align:center}

/* Bottom sheet de lectura */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet-in{max-width:480px;margin:0 auto;background:#111A25;border:1px solid var(--hair);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 22px)}
html.nocturno .sheet-in{background:#0E1116}
.grab{width:40px;height:5px;border-radius:999px;background:var(--glass-3);margin:0 auto 16px}
.sheet h4{margin:0 0 16px;font-size:1rem;font-weight:800}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.opt + .opt{border-top:1px solid var(--hair)}
.opt label{font-weight:700}
.opt small{display:block;color:var(--t3);font-weight:600;font-size:.78rem}
.seg.sm{grid-template-columns:repeat(3,56px);margin:0}
.seg.sm button{height:34px;font-family:var(--serif)}
.sw{width:52px;height:32px;border-radius:999px;background:var(--glass-3);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
body.sheet-open .scrim{opacity:1;pointer-events:auto}
body.sheet-open .sheet{transform:none}
.cargando{padding:80px 0;text-align:center;color:var(--t3);font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="app"><p class="cargando">Cargando cuentos…</p></div></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Ajustes de lectura"><div class="sheet-in">
  <div class="grab"></div>
  <h4>Ajustes de lectura</h4>
  <div class="opt"><div><label>Tamaño de letra</label><small>Se guarda en este teléfono</small></div>
    <div class="seg sm" id="tamSeg"><button data-t="1.08">A</button><button data-t="1.2" style="font-size:1.05rem">A</button><button data-t="1.36" style="font-size:1.2rem">A</button></div></div>
  <div class="opt"><div><label>Modo nocturno</label><small>Texto cálido, menos luz azul</small></div>
    <button class="sw" id="swNoct" role="switch" aria-checked="false" aria-label="Modo nocturno"></button></div>
  <div class="opt"><div><label>Pantalla siempre encendida</label><small>Mientras lee, si el iPhone lo permite</small></div>
    <button class="sw" id="swWake" role="switch" aria-checked="true" aria-label="Pantalla encendida"></button></div>
</div></div>

<script>
const LOGO = '<img src="/icon-96.png" alt="" width="44" height="44" style="width:44px;height:44px;border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.06)">';
const I = {
  sol:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.8v2M12 19.2v2M2.8 12h2M19.2 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M5.5 18.5l1.4-1.4M17.1 6.9l1.4-1.4"/></svg>',
  luna:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
  atras:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  flecha:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  libro:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6.5c3-1.2 6-1.1 9 .6v12c-3-1.7-6-1.8-9-.6v-12zM21 6.5c-3-1.2-6-1.1-9 .6v12c3-1.7 6-1.8 9-.6v-12z"/></svg>',
  check:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  aa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18l5-12 5 12M4.7 14h6.6M15 18l3.2-7.5L21.4 18M16 15.8h4.4"/></svg>',
  orn:'<svg width="64" height="12" viewBox="0 0 64 12" fill="none"><path d="M0 6h24M40 6h24" stroke="currentColor" stroke-width="1"/><path d="M32 1.5l1.3 3.2 3.2 1.3-3.2 1.3L32 10.5l-1.3-3.2L27.5 6l3.2-1.3z" fill="var(--accent)"/></svg>'
};
const DIAS = {lun:"Lunes",mar:"Martes",mie:"Miércoles",jue:"Jueves",vie:"Viernes",sab:"Sábado",dom:"Domingo"};
const ORDEN = ["lun","mar","mie","jue","vie","sab","dom"];
const TIPO = {ja:"Con J.A.",clasico:"Clásico",original:"Original"};
const SEMANAS = 4, PPM = 110;
const LUNES0 = new Date(2026,8,21);  // lunes de la semana 1
const ARRANQUE = new Date(2026,8,25); // primer día con cuentos (vie 25/09/2026)

const store={get(k,d){try{const v=localStorage.getItem("cja."+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("cja."+k,JSON.stringify(v))}catch(e){}}};
let leidos=store.get("leidos",{}), tam=store.get("tam",1.2), nocturno=store.get("nocturno",false), wake=store.get("wake",true);

const ahora=new Date(), hoy0=new Date(ahora.getFullYear(),ahora.getMonth(),ahora.getDate());
const diasDesde=Math.max(0,Math.round((hoy0-LUNES0)/864e5)), ciclo=Math.floor(diasDesde/28);
const diaHoy=["dom","lun","mar","mie","jue","vie","sab"][ahora.getDay()];
const momento=ahora.getHours()<17?"siesta":"noche";
const semHoy=Math.floor(diasDesde/7)%SEMANAS+1;
let semVista=semHoy, CUENTOS=[], cargadas=[];

const fechaDe=(s,d)=>{const f=new Date(LUNES0);f.setDate(f.getDate()+ciclo*28+(s-1)*7+ORDEN.indexOf(d));return f};
const fmt=f=>f.toLocaleDateString("es",{day:"numeric",month:"short"}).replace(".","");
const mins=c=>Math.round(c.palabras/PPM);
const buscar=(s,d,m)=>CUENTOS.find(c=>c.semana===s&&c.dia===d&&c.momento===m);
const deHoy=m=>buscar(semHoy,diaHoy,m)||CUENTOS.filter(c=>c.dia===diaHoy&&c.momento===m).sort((a,b)=>a.semana-b.semana)[0];
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const app=document.getElementById("app");
const ir=id=>{location.hash=id};

function portada(){
  document.title="Cuentos de J.A.";
  const principal=deHoy(momento), otro=deHoy(momento==="siesta"?"noche":"siesta");
  const repetido=[principal,otro].some(c=>c&&c.semana!==semHoy);
  const saludo=momento==="siesta"?"Para la siesta de hoy":"Para dormir esta noche";
  const l=principal&&leidos[principal.id];
  let seg=""; for(let s=1;s<=SEMANAS;s++){const ok=cargadas.includes(s);seg+=`<button data-sem="${s}" aria-pressed="${s===semVista}" ${ok?"":"disabled"}>S${s}</button>`}
  let dias=""; for(const d of ORDEN){
    if(fechaDe(semVista,d)<ARRANQUE) continue;
    const esHoy=d===diaHoy&&semVista===semHoy;
    dias+=`<div class="dia glass${esHoy?" hoy":""}"><div class="dia-h"><span>${DIAS[d]} ${fmt(fechaDe(semVista,d))}</span>${esHoy?"<span>Hoy</span>":""}</div>${fila(buscar(semVista,d,"siesta"),"siesta")}${fila(buscar(semVista,d,"noche"),"noche")}</div>`;
  }
  const total=CUENTOS.length, hechos=CUENTOS.filter(c=>leidos[c.id]).length;
  app.innerHTML=`<div class="app">
    <header class="head">
      <div class="brand">${LOGO}<div><h1>Cuentos de J.A.</h1><p>${DIAS[diaHoy]} ${fmt(hoy0)} · Semana ${semHoy}</p></div></div>
      <button class="round" id="bNoct" aria-label="Modo nocturno" aria-pressed="${nocturno}">${I.luna}</button>
    </header>
    <p class="eyebrow">${saludo}</p>
    ${principal?`<section class="hero glass">
      <div class="chips"><span class="chip acc">${momento==="siesta"?I.sol+"Siesta":I.luna+"Noche"}</span><span class="chip">${TIPO[principal.tipo]}</span></div>
      <h2>${esc(principal.titulo)}</h2>
      <p class="tema">${esc(principal.tema)}</p>
      <div class="meta"><span>≈ ${mins(principal)} min</span><span>${principal.palabras} palabras</span>${l?`<span style="color:var(--ok)">Leído ${l}</span>`:""}</div>
      <button class="cta" data-id="${principal.id}">${I.libro}Leer ahora</button>
    </section>`:`<section class="hero glass"><h2>Aún no hay cuento para hoy</h2></section>`}
    ${otro?`<button class="next glass" data-id="${otro.id}"><span class="ic">${otro.momento==="siesta"?I.sol:I.luna}</span><span><small>${otro.momento==="siesta"?"Siesta":"Noche"} · ≈ ${mins(otro)} min</small><b>${esc(otro.titulo)}</b></span><span class="arr">${I.flecha}</span></button>`:""}
    ${repetido?`<p class="aviso">La semana ${semHoy} aún no tiene cuento para hoy; se repite uno de otra semana.</p>`:""}
    <section class="sec">
      <div class="sec-h"><h3>Semana ${semVista}</h3><span>${hechos}/${total} leídos</span></div>
      <div class="seg" role="group" aria-label="Semana">${seg}</div>
      <p class="rango">${fmt(new Date(Math.max(fechaDe(semVista,"lun"),ARRANQUE)))} – ${fmt(fechaDe(semVista,"dom"))}</p>
      <div class="dias">${dias}</div>
    </section>
    <p class="pie">Cada semana va de lunes a domingo y rota del 1 al 4 (la semana 1 empezó el viernes 25 de septiembre). Antes de las 17:00 se propone la siesta; después, la noche. Tiempos a ${PPM} palabras por minuto.</p>
  </div>`;
  app.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>ir(b.dataset.id));
  app.querySelectorAll("[data-sem]").forEach(b=>b.onclick=()=>{semVista=+b.dataset.sem;portada()});
  document.getElementById("bNoct").onclick=()=>{setNoct(!nocturno);portada()};
  soltar();
}
function fila(c,m){
  if(!c) return `<div class="row vacia"><span class="m">${m==="siesta"?I.sol:I.luna}</span><span><b>Próximamente</b></span><span></span></div>`;
  const l=leidos[c.id];
  return `<button class="row" data-id="${c.id}"><span class="m">${c.momento==="siesta"?I.sol:I.luna}</span><span><b>${esc(c.titulo)}</b><small>${TIPO[c.tipo]} · ${esc(c.tema)}</small></span><span class="r${l?" ok":""}">${l?I.check:mins(c)+" min"}</span></button>`;
}

function lector(c){
  document.title=c.titulo;
  const sig=c.momento==="siesta"?buscar(c.semana,c.dia,"noche"):null;
  const l=leidos[c.id];
  app.innerHTML=`<div class="bar"><div class="bar-in">
      <button class="pill-btn" id="bVolver">${I.atras}Cuentos</button><span class="sp"></span>
      <button class="round" id="bAjustes" aria-label="Ajustes de lectura">${I.aa}</button>
    </div><div class="prog"><i id="prog"></i></div></div>
    <article class="lector">
      <div class="chips"><span class="chip acc">${c.momento==="siesta"?I.sol+"Siesta":I.luna+"Noche"}</span><span class="chip">≈ ${mins(c)} min</span><span class="chip">${DIAS[c.dia]}</span></div>
      <h1>${esc(c.titulo)}</h1>
      <p class="fuente">${esc(c.fuente)}</p>
      <div class="orn">${I.orn}</div>
      <div class="texto">${c.p.map(p=>`<p>${esc(p)}</p>`).join("")}</div>
      <div class="fin">
        <div class="orn">${I.orn}</div>
        <button class="cta${l?" done":""}" id="bLeido">${I.check}${l?"Leído el "+l:"Marcar como leído"}</button>
        ${sig?`<button class="ghost" data-id="${sig.id}">${I.luna} Esta noche: ${esc(sig.titulo)}</button>`:""}
        <button class="ghost" id="bInicio">Volver a los cuentos</button>
      </div>
    </article>`;
  window.scrollTo(0,0);
  document.getElementById("bVolver").onclick=()=>{history.length>1?history.back():ir("")};
  document.getElementById("bInicio").onclick=()=>ir("");
  document.getElementById("bAjustes").onclick=abrirSheet;
  document.getElementById("bLeido").onclick=()=>{
    if(leidos[c.id]) delete leidos[c.id]; else leidos[c.id]=new Date().toLocaleDateString("es",{day:"numeric",month:"short"}).replace(".","");
    store.set("leidos",leidos); const y=scrollY; lector(c); scrollTo(0,y);
  };
  app.querySelectorAll(".fin [data-id]").forEach(b=>b.onclick=()=>ir(b.dataset.id));
  if(wake) mantener();
}

/* Ajustes */
const sheetEl=document.getElementById("sheet");
function abrirSheet(){document.body.classList.add("sheet-open");pintarSheet()}
function cerrarSheet(){document.body.classList.remove("sheet-open")}
document.getElementById("scrim").onclick=cerrarSheet;
let y0=null; sheetEl.addEventListener("touchstart",e=>{y0=e.touches[0].clientY},{passive:true});
sheetEl.addEventListener("touchend",e=>{if(y0!==null&&e.changedTouches[0].clientY-y0>60)cerrarSheet();y0=null});
function pintarSheet(){
  document.querySelectorAll("#tamSeg button").forEach(b=>b.setAttribute("aria-pressed",Math.abs(+b.dataset.t-tam)<.01));
  document.getElementById("swNoct").setAttribute("aria-checked",nocturno);
  document.getElementById("swWake").setAttribute("aria-checked",wake);
}
document.querySelectorAll("#tamSeg button").forEach(b=>b.onclick=()=>{setTam(+b.dataset.t);pintarSheet()});
document.getElementById("swNoct").onclick=()=>{setNoct(!nocturno);pintarSheet()};
document.getElementById("swWake").onclick=()=>{wake=!wake;store.set("wake",wake);wake?mantener():soltar();pintarSheet()};
function setTam(v){tam=v;store.set("tam",v);document.documentElement.style.setProperty("--read-size",v+"rem")}
function setNoct(v){nocturno=v;store.set("nocturno",v);document.documentElement.classList.toggle("nocturno",v);document.querySelector('meta[name="theme-color"]').content=v?"#05080C":"#070E16"}

/* Pantalla encendida */
let lock=null;
async function mantener(){try{if("wakeLock" in navigator&&!lock){lock=await navigator.wakeLock.request("screen");lock.addEventListener("release",()=>{lock=null})}}catch(e){lock=null}}
function soltar(){try{lock&&lock.release()}catch(e){}lock=null}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&location.hash&&wake)mantener()});

addEventListener("scroll",()=>{const p=document.getElementById("prog");if(!p)return;const h=document.documentElement,max=h.scrollHeight-h.clientHeight;p.style.width=(max>0?Math.min(100,h.scrollTop/max*100):0)+"%"},{passive:true});

function ruta(){cerrarSheet();const c=CUENTOS.find(x=>x.id===location.hash.slice(1));c?lector(c):portada()}
addEventListener("hashchange",ruta);
setTam(tam); setNoct(nocturno);
fetch("/cuentos.json",{cache:"no-cache"}).then(r=>r.json()).then(d=>{CUENTOS=d.cuentos;cargadas=[...new Set(CUENTOS.map(c=>c.semana))].sort();ruta()})
 .catch(()=>{app.innerHTML='<div class="app"><p class="cargando">No se pudieron cargar los cuentos. Revise la conexión y vuelva a abrir.</p></div>'});
</script>
</body>
</html>
