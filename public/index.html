<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDF1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D131D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<title>Cuentos de J.A.</title>
<meta name="apple-mobile-web-app-title" content="Cuentos J.A.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Nunito:wght@500;700;800&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --surface-2:#E3E9F0; --ink:#18212E; --ink-read:#1E2836;
  --muted:#5A6678; --line:#D3DBE5; --accent:#C9571F; --accent-ink:#FFFFFF;
  --sol:#B97A00; --sol-bg:#FBF0D4; --luna:#5652C4; --luna-bg:#E6E5FA; --ok:#2F7D4F;
  --read-size:1.22rem;
  font-family:"Nunito",ui-rounded,system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D131D; --surface:#151D2A; --surface-2:#1C2636; --ink:#E4E9F0; --ink-read:#C9D1DC;
    --muted:#8C99AC; --line:#263245; --accent:#EE8A50; --accent-ink:#1A0F08;
    --sol:#F0BF52; --sol-bg:#2A2412; --luna:#A7A4F2; --luna-bg:#1E1F3C; --ok:#6CC592;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D131D; --surface:#151D2A; --surface-2:#1C2636; --ink:#E4E9F0; --ink-read:#C9D1DC;
  --muted:#8C99AC; --line:#263245; --accent:#EE8A50; --accent-ink:#1A0F08;
  --sol:#F0BF52; --sol-bg:#2A2412; --luna:#A7A4F2; --luna-bg:#1E1F3C; --ok:#6CC592;
}
/* Modo lectura nocturna forzado desde la app */
body.nocturno{
  color-scheme:dark;
  --bg:#0A0E15; --surface:#121925; --surface-2:#18212F; --ink:#D6CDBE; --ink-read:#C4B9A6;
  --muted:#857C6E; --line:#222B38; --accent:#D98A55; --accent-ink:#1A0F08;
  --sol:#D9AE55; --sol-bg:#241F12; --luna:#9E9BE0; --luna-bg:#1B1C33; --ok:#7FB592;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Nunito",ui-rounded,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;}
.wrap{max-width:640px;margin:0 auto;padding-inline:18px;padding-block:18px 48px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Portada */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.marca{display:flex;flex-direction:column;gap:2px}
.marca h1{font-family:"Literata",Georgia,serif;font-weight:600;font-size:1.7rem;margin:0;letter-spacing:-.01em}
.marca span{color:var(--muted);font-size:.9rem;font-weight:700}
.icono-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icono-btn svg{width:22px;height:22px}

.hoy{display:flex;flex-direction:column;gap:12px;margin-bottom:26px}
.hoy-label{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.tarjeta{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 16px 14px}
.tarjeta.ahora{border:2px solid var(--accent);padding:15px 15px 13px}
.t-fila{display:flex;align-items:center;justify-content:space-between;gap:8px}
.momento{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.82rem;padding:4px 10px;border-radius:999px}
.momento svg{width:15px;height:15px}
.m-siesta{background:var(--sol-bg);color:var(--sol)}
.m-noche{background:var(--luna-bg);color:var(--luna)}
.badge-ahora{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);padding:3px 9px;border-radius:999px}
.t-titulo{font-family:"Literata",Georgia,serif;font-size:1.28rem;font-weight:600;line-height:1.25;margin:0;text-wrap:balance}
.t-meta{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--muted);font-size:.86rem;font-weight:700}
.t-tema{color:var(--ink);font-weight:700;font-size:.92rem}
.hecho{color:var(--ok)}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:8px 0 12px}
.sec-h h2{font-size:1.05rem;margin:0;font-weight:800}
.semanas{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.sem{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:800;font-size:.9rem}
.sem[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sem:disabled{opacity:.45;cursor:not-allowed}
.nota{color:var(--muted);font-size:.86rem;margin:-4px 0 14px}

.dias{display:flex;flex-direction:column;gap:10px}
.dia{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.dia.es-hoy{border-color:var(--accent)}
.dia-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 4px;font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dia.es-hoy .dia-h{color:var(--accent)}
.fila{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 14px;min-height:56px}
.dia-h + .fila{border-top:0}
.fila .ico{width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.fila .ico svg{width:16px;height:16px}
.fila .nom{font-weight:700;font-size:1rem;line-height:1.25}
.fila .sub{display:block;color:var(--muted);font-size:.8rem;font-weight:700;margin-top:2px}
.fila .der{color:var(--muted);font-size:.8rem;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.fila .der.ok{color:var(--ok)}
.pie{color:var(--muted);font-size:.8rem;margin-top:26px;line-height:1.5}

/* Lector */
.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.barra-in{max-width:640px;margin:0 auto;padding-inline:10px;display:flex;align-items:center;gap:6px;height:54px}
.volver{display:flex;align-items:center;gap:2px;background:none;border:0;font-weight:800;font-size:1rem;padding:8px 8px;color:var(--accent)}
.volver svg{width:22px;height:22px}
.esp{flex:1}
.ctrl{min-width:44px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-family:"Literata",Georgia,serif}
.progreso{height:3px;background:var(--line)}
.progreso i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s linear}
.lector{max-width:640px;margin:0 auto;padding-inline:22px;padding-block:24px 60px}
.l-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.l-meta .dato{color:var(--muted);font-weight:700;font-size:.86rem}
.lector h1{font-family:"Literata",Georgia,serif;font-weight:600;font-size:1.9rem;line-height:1.18;margin:0 0 6px;text-wrap:balance;letter-spacing:-.01em}
.l-fuente{color:var(--muted);font-style:italic;font-family:"Literata",Georgia,serif;margin:0 0 26px}
.texto{font-family:"Literata",Georgia,serif;font-size:var(--read-size);line-height:1.72;color:var(--ink-read);hyphens:manual}
.texto p{margin:0 0 .9em}
.texto p.dlg{padding-left:.2em}
.texto p:first-child::first-letter{font-size:3.1em;float:left;line-height:.9;padding:.06em .08em 0 0;font-weight:600;color:var(--accent)}
.fin{margin-top:34px;padding-top:22px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;font-weight:800;font-size:1rem;border:1px solid var(--line);background:var(--surface)}
.btn.prim{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{background:none;color:var(--ok);border-color:var(--ok)}
.sig{color:var(--muted);font-size:.86rem;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><p style="padding:40px 20px;text-align:center;color:#5A6678">Cargando cuentos…</p></div>

<script>
let CUENTOS = [];
const DIAS = [["lun","Lunes"],["mar","Martes"],["mie","Miércoles"],["jue","Jueves"],["vie","Viernes"],["sab","Sábado"],["dom","Domingo"]];
const SEMANAS_TOTAL = 4;
const PPM = 110; // palabras por minuto, ritmo lento de cuento
const TIPO = {ja:"Con J.A.", clasico:"Clásico", original:"Original"};
const ICO = {
  sol:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>',
  luna:'<svg viewBox="0 0 24 24"><path fill="currentColor" d="M20.2 14.6A8.5 8.5 0 0 1 9.4 3.8a8.5 8.5 0 1 0 10.8 10.8z"/></svg>',
  atras:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  ojo:'<svg viewBox="0 0 24 24"><path fill="currentColor" d="M20.2 14.6A8.5 8.5 0 0 1 9.4 3.8a8.5 8.5 0 1 0 10.8 10.8z"/></svg>',
  check:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};

/* Almacenamiento local seguro (solo en este teléfono) */
const store = {
  get(k,d){try{const v=localStorage.getItem("cja."+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("cja."+k,JSON.stringify(v))}catch(e){}}
};
let leidos = store.get("leidos",{});
let tam = store.get("tam",1.22);
let nocturno = store.get("nocturno",false);

/* Rotación: cada semana de cuentos va de viernes a jueves. Semana 1 empieza el viernes 25/09/2026. */
const INICIO = new Date(2026,8,25);
const ORDEN = ["vie","sab","dom","lun","mar","mie","jue"];
const ahora = new Date();
const hoy0 = new Date(ahora.getFullYear(),ahora.getMonth(),ahora.getDate());
const diasDesde = Math.max(0, Math.round((hoy0-INICIO)/864e5));
const ciclo = Math.floor(diasDesde/28);
const diaHoy = DIAS[(ahora.getDay()+6)%7][0];
const momentoAhora = ahora.getHours() < 17 ? "siesta" : "noche";
let semanasCargadas = [];
const semHoy = Math.floor(diasDesde/7)%SEMANAS_TOTAL+1;
let semVista = semHoy;
const fechaDe = (s,d) => {const f=new Date(INICIO);f.setDate(f.getDate()+ciclo*28+(s-1)*7+ORDEN.indexOf(d));return f};
const fmt = f => f.toLocaleDateString("es",{day:"numeric",month:"short"}).replace(".","");

const mins = c => Math.round(c.palabras/PPM);
const buscar = (s,d,m) => CUENTOS.find(c=>c.semana===s&&c.dia===d&&c.momento===m);
/* Si el cuento de hoy aún no está cargado, se usa el del mismo día de la semana 1 */
const deHoy = m => buscar(semHoy,diaHoy,m) || buscar(1,diaHoy,m);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const nomDia = d => DIAS.find(x=>x[0]===d)[1];
const pill = m => `<span class="momento m-${m}">${m==="siesta"?ICO.sol+"Siesta":ICO.luna+"Noche"}</span>`;

function tarjeta(c){
  if(!c) return "";
  const act = c.momento===momentoAhora;
  const l = leidos[c.id];
  return `<button class="tarjeta${act?" ahora":""}" data-id="${c.id}">
    <div class="t-fila">${pill(c.momento)}${act?'<span class="badge-ahora">Toca ahora</span>':""}</div>
    <p class="t-titulo">${esc(c.titulo)}</p>
    <div class="t-tema">${esc(c.tema)}</div>
    <div class="t-meta"><span>≈ ${mins(c)} min</span><span>${c.palabras} palabras</span><span>${TIPO[c.tipo]}</span>${l?`<span class="hecho">Leído ${l}</span>`:""}</div>
  </button>`;
}
function fila(c){
  if(!c) return `<div class="fila"><span></span><span class="nom" style="color:var(--muted)">Pendiente</span><span></span></div>`;
  const l = leidos[c.id];
  return `<button class="fila" data-id="${c.id}">
    <span class="ico m-${c.momento}">${c.momento==="siesta"?ICO.sol:ICO.luna}</span>
    <span><span class="nom">${esc(c.titulo)}</span><span class="sub">${TIPO[c.tipo]} · ${esc(c.tema)}</span></span>
    <span class="der${l?" ok":""}">${l?ICO.check:"≈ "+mins(c)+" min"}</span>
  </button>`;
}

function portada(){
  document.title = "Cuentos de J.A.";
  const hoyS = deHoy("siesta"), hoyN = deHoy("noche");
  const orden = momentoAhora==="siesta" ? [hoyS,hoyN] : [hoyN,hoyS];
  const repetido = (hoyS&&hoyS.semana!==semHoy)||(hoyN&&hoyN.semana!==semHoy);
  let semBtns = "";
  for(let s=1;s<=SEMANAS_TOTAL;s++){
    const ok = semanasCargadas.includes(s);
    semBtns += `<button class="sem" data-sem="${s}" aria-pressed="${s===semVista}" ${ok?"":"disabled"}>Semana ${s}${ok?"":" · pronto"}</button>`;
  }
  const notaRot = repetido ? `<p class="nota">Los cuentos de la semana ${semHoy} para hoy aún no están cargados; se repiten los de la semana 1.</p>` : "";
  const rango = `${fmt(fechaDe(semVista,"vie"))} – ${fmt(fechaDe(semVista,"jue"))}`;
  let dias = "";
  for(const d of ORDEN){
    const hoy = d===diaHoy && semVista===semHoy;
    dias += `<div class="dia${hoy?" es-hoy":""}"><div class="dia-h"><span>${nomDia(d)} ${fmt(fechaDe(semVista,d))}</span>${hoy?"<span>Hoy</span>":""}</div>
      ${fila(buscar(semVista,d,"siesta"))}${fila(buscar(semVista,d,"noche"))}</div>`;
  }
  const total = CUENTOS.length, hechos = CUENTOS.filter(c=>leidos[c.id]).length;
  app.innerHTML = `<div class="wrap">
    <div class="top">
      <div class="marca"><h1>Cuentos de J.A.</h1><span>${nomDia(diaHoy)} ${fmt(hoy0)} · Semana ${semHoy} de ${SEMANAS_TOTAL}</span></div>
      <button class="icono-btn" id="bNoct" aria-label="Modo lectura nocturna" aria-pressed="${nocturno}">${ICO.ojo}</button>
    </div>
    <section class="hoy"><div class="hoy-label">Hoy</div>${orden.map(tarjeta).join("")}</section>
    ${notaRot}
    <div class="sec-h"><h2>Semana ${semVista} · ${rango}</h2><span class="t-meta">${hechos} de ${total} leídos</span></div>
    <div class="semanas">${semBtns}</div>
    <div class="dias">${dias}</div>
    <p class="pie">La rotación cambia sola: cada semana de cuentos va de viernes a jueves, empezando el viernes 25 de septiembre, y después de la semana 4 vuelve a la 1. Antes de las 17:00 se destaca la siesta; después, la noche. Las marcas de "leído" y el tamaño de letra se guardan solo en este teléfono. Tiempo estimado a ${PPM} palabras por minuto, ritmo lento de cuento.</p>
  </div>`;
  app.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{location.hash=b.dataset.id});
  app.querySelectorAll("[data-sem]").forEach(b=>b.onclick=()=>{semVista=+b.dataset.sem;portada()});
  bNoct.onclick=()=>{nocturno=!nocturno;store.set("nocturno",nocturno);aplicarNoct();portada()};
  soltarPantalla();
}

function lector(c){
  document.title = c.titulo;
  const idx = CUENTOS.indexOf(c);
  const sig = c.momento==="siesta" ? buscar(c.semana,c.dia,"noche") : null;
  const l = leidos[c.id];
  app.innerHTML = `<div class="barra"><div class="barra-in">
      <button class="volver" id="bVolver">${ICO.atras}Cuentos</button><span class="esp"></span>
      <button class="ctrl" id="bMenos" aria-label="Letra más pequeña">A−</button>
      <button class="ctrl" id="bMas" aria-label="Letra más grande" style="font-size:1.15rem">A+</button>
      <button class="ctrl" id="bNoct2" aria-label="Modo lectura nocturna" aria-pressed="${nocturno}">${ICO.ojo}</button>
    </div><div class="progreso"><i id="prog"></i></div></div>
    <article class="lector">
      <div class="l-meta">${pill(c.momento)}<span class="dato">${nomDia(c.dia)} · ≈ ${mins(c)} min · ${c.palabras} palabras</span></div>
      <h1>${esc(c.titulo)}</h1>
      <p class="l-fuente">${esc(c.fuente)}</p>
      <div class="texto">${c.p.map(p=>`<p${p.startsWith("—")?' class="dlg"':""}>${esc(p)}</p>`).join("")}</div>
      <div class="fin">
        ${l?`<button class="btn ok" id="bLeido">${ICO.check} Leído el ${l} · desmarcar</button>`:`<button class="btn prim" id="bLeido">${ICO.check} Marcar como leído</button>`}
        ${sig?`<button class="btn" data-id="${sig.id}">Cuento de la noche: ${esc(sig.titulo)}</button>`:""}
        <button class="btn" id="bVolver2">Volver a la lista</button>
      </div>
    </article>`;
  window.scrollTo(0,0);
  const volver=()=>{history.length>1&&location.hash?history.back():(location.hash="")};
  bVolver.onclick=volver; bVolver2.onclick=()=>{location.hash=""};
  bMenos.onclick=()=>setTam(tam-0.08); bMas.onclick=()=>setTam(tam+0.08);
  bNoct2.onclick=()=>{nocturno=!nocturno;store.set("nocturno",nocturno);aplicarNoct();bNoct2.setAttribute("aria-pressed",nocturno)};
  bLeido.onclick=()=>{
    if(leidos[c.id]) delete leidos[c.id];
    else leidos[c.id]=new Date().toLocaleDateString("es",{day:"numeric",month:"short"});
    store.set("leidos",leidos); lector(c);
  };
  app.querySelectorAll(".fin [data-id]").forEach(b=>b.onclick=()=>{location.hash=b.dataset.id});
  mantenerPantalla();
}

function setTam(v){tam=Math.min(1.8,Math.max(1,Math.round(v*100)/100));store.set("tam",tam);document.documentElement.style.setProperty("--read-size",tam+"rem")}
function aplicarNoct(){document.body.classList.toggle("nocturno",nocturno)}

/* Mantener la pantalla encendida mientras se lee (si el navegador lo permite) */
let lock=null;
async function mantenerPantalla(){try{if("wakeLock" in navigator&&!lock){lock=await navigator.wakeLock.request("screen");lock.addEventListener("release",()=>{lock=null})}}catch(e){lock=null}}
function soltarPantalla(){try{lock&&lock.release()}catch(e){}lock=null}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&location.hash)mantenerPantalla()});

window.addEventListener("scroll",()=>{const p=document.getElementById("prog");if(!p)return;const h=document.documentElement;const max=h.scrollHeight-h.clientHeight;p.style.width=(max>0?Math.min(100,h.scrollTop/max*100):0)+"%"},{passive:true});

function ruta(){const id=location.hash.slice(1);const c=CUENTOS.find(x=>x.id===id);c?lector(c):portada()}
window.addEventListener("hashchange",ruta);
setTam(tam); aplicarNoct();
fetch("/cuentos.json",{cache:"no-cache"}).then(r=>r.json()).then(d=>{
  CUENTOS=d.cuentos; semanasCargadas=[...new Set(CUENTOS.map(c=>c.semana))].sort(); ruta();
}).catch(()=>{app.innerHTML='<div class="wrap"><p class="nota">No se pudieron cargar los cuentos. Revise la conexión y vuelva a abrir la página.</p></div>'});
</script>
</body>
</html>
